      3." 开头、含 "TodoWriteTool"、"CallSearchAgentTool"、"CallCodeAgentTool"、"Always
      call TodoWriteTool before delegating new work." 且以 "End with a concise
      supervisor summary after the needed specialist calls." 结尾 AND
      `novagent.graph.nodes.PLANNER_PROMPT` 与 stage3 常量为同一对象 AND
      `novagent.prompts.stage2` 不再有
      `PLANNER_PROMPT`/`ACTOR_PROMPT`/`VERIFIER_PROMPT` 属性、仍有 `FINAL_PROMPT`。'
    result: passed
    reason:
      text: stage3.py PLANNER_PROMPT 与规格原文逐行一致（开头句/三工具名/Always 句/结尾句齐全，尾部换行为惯例）；nodes
        以 from-import 持有同一对象且有 is 断言；stage2 仅余 FINAL_PROMPT 并有属性缺失断言。
      truncated: false
