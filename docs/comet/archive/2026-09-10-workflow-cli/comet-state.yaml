  summary:
    text: 本轮把 core/agent.py 切换为 LangGraph 工作流驱动并升级 CLI：agent.py 的
      stream_agent_events 新签名 (task, *, workspace, max_attempts=3,
      model=None)，内部 build_workflow(model=model).stream(inputs,
      stream_mode=['updates','custom'])；custom 事件补 node='actor'
      实时转发（ai_message/tool_call/tool_result/final_answer），updates 解析为
      node_output 事件（planner 含
      plan_summary/todos/acceptance_criteria/verification_commands，verifier 含
      passed/reason/verification_results/verification_checks，final 含
      final_answer），actor 节点更新不重复产出；verifier 事件 reason 为结论原因（通过取
      final_answer，失败取 last_error 末行），命令详情在 verification_results。旧手写循环与 stage1
      ACTOR_PROMPT 删除，提示词统一用 prompts.stage2。workflow.py actor 注册改为图内包装
      _actor，get_stream_writer() 作为 on_event 使内部事件进入 custom 流（invoke
      下静默丢弃已探针验证；actor_node 接口不变）。nodes.py 的 _execute_tool
      移入本地解开循环导入（逐字不变）。cli/app.py 新增 --max-attempts（默认 3，min=1）透传，_print_event
      按统一事件渲染 📋 Planner（计划+todos）、🔧 Actor 标头+工具详情、✅/❌
      Verifier（reason+每条命令退出码，超时显示 failed to run）、📝 Final；忽略 actor 内部
      final_answer 与 node_output+actor；全部 escape 转义。tests/test_agent_loop.py
      按统一事件语义重写（通过/回环/预算耗尽 4 测试），test_cli.py 重写（帮助/缺 key/徽标顺序/--max-attempts
      传值与默认/❌ 分支 6 测试），test_graph_workflow.py 删除依赖已移除常量的用例。处理全部验收项
      A1-A5。开发期检查：uv run pytest 69 passed（离线）、uv run novagent --help 退出码 0 且含
      --max-attempts、uv lock --check 一致（无新依赖）。已知限制：verifier 超时命令在事件层
      exit_code=None（CLI 显示 failed to run）。
    truncated: false
