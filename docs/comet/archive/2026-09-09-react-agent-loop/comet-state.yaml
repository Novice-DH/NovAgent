acceptance:
  - id: A1
    source: brief.md
    text: 'A1: Scenario: ReAct 循环产出完整事件序列 WHEN 以临时 workspace 和注入的 FakeModel（第一轮返回
      `write_file` 写 `note.txt` 内容 `"hi"` 的 tool_call，第二轮返回纯文本 `"All done."`）调用
      `stream_agent_events("create a note", workspace=ws, model=fake)` THEN 事件
      `type` 依次为
      `ai_message`、`tool_call`、`tool_result`、`ai_message`、`final_answer` AND
      `tool_call` 事件 name 为 `write_file` 且 args 为 `{"file_path": "note.txt",
      "content": "hi"}` AND `final_answer` 事件 content 为 `"All done."` AND
      workspace 中出现 `note.txt` 且内容为 `"hi"` AND 第二轮发给模型的消息最后一条是 `ToolMessage`，其
      `tool_call_id` 等于 tool_call 的 id，content 为 `json.dumps` 后的结果。'
    result: passed
    reason:
      text: 独立内联复验与测试均确认：事件序列依次为
        ai_message/tool_call/tool_result/ai_message/final_answer，tool_call 为
        write_file 且 args {"file_path":"note.txt","content":"hi"}，final_answer 为
        "All done."，note.txt 内容为 hi，ToolMessage.tool_call_id 等于 call_1 且 content
        == json.dumps(result)
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Scenario: 消息构建使用 ACTOR_PROMPT WHEN 检查 FakeModel 收到的第一轮消息 THEN 依次为
      SystemMessage 与 HumanMessage AND SystemMessage.content 等于
      `novagent.core.agent.ACTOR_PROMPT` AND HumanMessage.content 等于传入的 task AND
      `ACTOR_PROMPT` 以 \"You are the actor node in novagent's ReAct workflow.\"
      开头。"
    result: passed
    reason:
      text: 首轮消息依次为 SystemMessage(ACTOR_PROMPT) 与 HumanMessage(task)，内容分别等于模块常量与传入
        task；程序化验证 ACTOR_PROMPT 以 "You are the actor node in novagent's ReAct
        workflow." 开头
      truncated: false
  - id: A3
    source: brief.md
    text: 'A3: Scenario: 工具异常转为错误回传 WHEN FakeModel 第一轮请求 `read_file`（目标文件不存在），第二轮返回
      `"Handled."` THEN 调用 `stream_agent_events` 不抛出异常 AND `tool_result` 事件
      result 以 `"Error:"` 开头 AND 第二轮消息最后一条 `ToolMessage.content` 以 `"Error:"`
      开头。'
    result: passed
    reason:
      text: 'read_file 对缺失文件抛异常被 _execute_tool 捕获，不向调用方抛出；tool_result 事件 result 以
        Error: 开头；ToolMessage.content 为 json.dumps 序列化文本，字面以 "Error:
        起始、json.loads 后以 Error: 开头，符合验收意图'
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4: Scenario: 未知工具名回传错误 WHEN FakeModel 第一轮请求未注册的 `no_such_tool`，第二轮返回
      `"Ok."` THEN `tool_result` 事件 result 包含 `"unknown tool"` AND 流程以
      `final_answer` 事件正常结束。'
    result: passed
    reason:
      text: "未知工具返回含 unknown tool 的错误文本（Error: unknown tool 'no_such_tool'）进入
        ToolMessage 与 tool_result 事件，流程以 final_answer(\"Ok.\") 正常结束"
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Scenario: max_loops 限制模型调用轮数 WHEN FakeModel 每轮都返回 tool_call 且以
      `max_loops=3` 调用 `stream_agent_events` THEN 模型恰好被调用 3 次 AND 生成器仍产出
      `final_answer` 事件。"
    result: passed
    reason:
      text: 循环为 for _ in range(max_loops)，max_loops=3 时模型恰好被调用 3 次，循环结束仍产出
        final_answer 事件，测试断言 len(model.calls)==3
      truncated: false
  - id: A6
    source: brief.md
    text: 'A6: Scenario: CLI 用 rich 实时打印事件 WHEN 将 `novagent.cli.app`
      依赖的模型与事件流替换为假实现（monkeypatch），使 `stream_agent_events` 依次产出
      `tool_call`（`bash`，`{"command": "echo
      hi"}`）、`tool_result`（`"hi"`）、`final_answer`（`"Done."`）后用 CliRunner 运行 `run
      "demo task" --workspace <临时目录>` THEN 退出码 0 AND 输出按顺序包含工具名 `bash`、命令参数
      `echo hi`、结果 `hi` 与最终回答 `Done.`。'
    result: passed
    reason:
      text: CLI run 命令消费 monkeypatch 假事件流，CliRunner 退出码 0，rich 打印顺序含 bash、echo
        hi、hi、Done.，四种事件分支均经 escape 转义；独立复跑测试通过
      truncated: false
builder_handoff:
  candidate_id: 07d46501-81ff-407d-b2fc-bb4ffc02dc1f
