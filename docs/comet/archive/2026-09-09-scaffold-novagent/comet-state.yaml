acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: uv 环境与 CLI 入口 WHEN 在仓库根目录运行 `uv sync` THEN 依赖安装成功并生成 `uv.lock`
      AND `uv run novagent --help` 退出码为 0，帮助文本包含位置参数 `task` 和选项 `--workspace`"
    result: passed
    reason:
      text: "自行复跑 uv sync 退出码 0（Resolved 55/Audited 51 packages）；uv.lock 存在且 uv lock
        --check 一致，pyproject.toml 为 name=novagent、src layout（uv_build
        后端）、requires-python>=3.10，运行依赖恰为
        langchain-openai/python-dotenv/typer（dev: pytest），锁中无 langgraph 与完整
        langchain 发行包；uv run novagent --help 退出码 0，帮助文本含位置参数 task 与选项
        --workspace；uv run python -m novagent --help 亦为 0（__main__.py 调用
        cli.app:main）。"
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 工具注册 WHEN 以临时目录为 workspace 构造 `RuntimeState` 并调用
      `build_tools(state)` THEN 返回 5 个 `StructuredTool`，名称依次为
      `read_file`、`write_file`、`edit_file`、`grep`、`bash`"
    result: passed
    reason:
      text: 独立探针：以系统临时目录为 workspace 构造 RuntimeState 后 build_tools(state) 返回 5 个
        langchain_core StructuredTool，名称依次为
        read_file/write_file/edit_file/grep/bash（registry.py
        顺序一致）；test_registry.py 断言顺序、类型与各工具 args_schema 字段。
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 文件工具路径安全与读写改语义 WHEN `FileReadTool` 读取 workspace 内的文本文件 THEN
      返回文件内容，`offset`/`limit` 可截取指定行范围 AND 传入解析后逃逸出 workspace 的 `file_path`（如
      `../x.txt` 或外部绝对路径）时报错且不产生读取/写入 AND `FileWriteTool` 可在 workspace
      内创建含父目录的新文件并覆写已有文件 AND `FileEditTool` 将唯一匹配的 `old_text` 替换为 `new_text` AND
      `old_text` 无匹配或多处匹配时报错且文件内容保持不变"
    result: passed
    reason:
      text: 探针实证：write_file 在 workspace 内创建含父目录新文件并可覆写；read_file 返回内容且
        offset=2/limit=2 得 'l2\nl3'；外部绝对路径写入被 ValueError 拒绝且目标文件未产生，../
        逃逸被拒；edit_file 唯一匹配替换成功，0 匹配与 2 处匹配均报错且文件内容保持不变。paths.py 先
        Path.resolve()（含 .. 与符号链接）再以 root in resolved.parents
        校验，逃逸报错含被拒路径。tests/test_file_tools.py、test_paths.py 全覆盖且 41/41 通过。
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: grep 与 bash 工具 WHEN `GrepTool` 以正则 `pattern` 搜索 workspace THEN
      按 `glob` 过滤文件、按 `ignore_case` 决定大小写敏感、最多返回 `head_limit` 条 `相对路径:行号:行内容`
      形式的匹配 AND `GrepTool` 的 `path` 逃逸出 workspace 时报错 AND `BashTool` 以 workspace
      为工作目录执行 `command` 并返回含退出码的输出 AND 超过 `timeout_seconds` 的命令被终止并报超时错误"
    result: passed
    reason:
      text: "探针实证：grep 输出为 相对路径:行号:行内容（a.py:1:def f():），glob=**/*.md 只命中 md
        文件，ignore_case=True 命中大小写变体，head_limit 截断生效，path='..' 逃逸报错，非法正则报
        ValueError；bash 以 workspace 为 cwd（cd 输出临时 workspace 路径）、非零退出码
        'exit_code: 3' 正常返回不抛异常；关键超时探针（子进程再孵 sleep(30)
        孙进程并持有管道，timeout_seconds=2）墙钟 2.22s 抛 TimeoutError，独立证实 bash_tool.py 的
        Popen+CREATE_NEW_PROCESS_GROUP/start_new_session+taskkill/killpg
        进程树终止真实生效；test_bash_tool.py 含 <8s 墙钟断言。"
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: 模型工厂 WHEN 目录 `.env` 中配置 `OPENAI_API_KEY` 后调用 `create_model()`
      THEN 返回 `langchain_openai.ChatOpenAI` 实例，其 api_key 来自 `.env` AND 缺少
      `OPENAI_API_KEY` 时报清晰的配置错误而非 ImportError/AttributeError"
    result: passed
    reason:
      text: 探针实证：临时目录 .env 写入 OPENAI_API_KEY 后 create_model() 返回
        langchain_openai.chat_models.base.ChatOpenAI 实例，api_key 取自
        .env（sk-probe-123），默认 model gpt-4o-mini；清空环境后缺 key 抛出含配置指引的 ValueError（非
        ImportError/AttributeError）。openai_provider.py 用
        load_dotenv(find_dotenv(usecwd=True))，OPENAI_MODEL/OPENAI_BASE_URL
        可选逻辑与规格一致；test_openai_provider.py 覆盖 .env 读取、模型覆盖与缺 key 报错，且密钥未被测试输出泄露。
      truncated: false
  - id: A6
    source: brief.md
    text: 'Scenario: CLI 任务执行与 workspace 自动创建 WHEN 运行 `uv run novagent "整理文件"
      --workspace <不存在的目录>` THEN 该目录（含父目录）被自动创建 AND 在缺少 `OPENAI_API_KEY`
      的环境中以清晰错误信息退出而非未捕获异常崩溃'
    result: passed
    reason:
      text: "端到端探针：env -u OPENAI_API_KEY uv run novagent \"整理文件\" --workspace
        <不存在三级嵌套目录> 退出码 1，stdout 打印 Workspace 路径，stderr 输出 'Configuration error:
        OPENAI_API_KEY is not set...'，无任何 Traceback（grep 计
        0），且目标目录（含全部父目录）已被自动创建。cli/app.py 在 create_model 之前 mkdir(parents=True,
        exist_ok=True)，ValueError 转 typer.Exit(1)；test_cli.py 以 CliRunner 覆盖默认
        workspace 创建、嵌套创建与缺 key 清晰退出，test_agent_loop.py 用 FakeModel
        离线验证工具循环/错误回填/25 轮上限。"
      truncated: false
