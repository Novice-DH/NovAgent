      `timeline_omitted` AND `timeline.md` 含事件行文本。"
    result: passed
    reason:
      text: test_trace_records_stats_and_files：三产物生成、各计数与输入一致、approval_count==approval_log
        条数、timeline_head<=20/tail<=80 且 timeline.md
        含事件行；test_timeline_head_tail_truncation 验证 152 行截断为 20/80/52
      truncated: false
  - id: A16
    source: brief.md
    text: "A16: Scenario: trace off WHEN trace 模式为 off THEN 各 record 方法为 no-op 且不创建
      `.novagent/traces` 目录。"
    result: passed
    reason:
      text: test_off_mode_is_noop：各 record 方法后计数为 0、timeline 为空且 .novagent/traces 未创建
      truncated: false
