  summary:
    text: 本轮实现 LangGraph 工作流三节点与路由：src/novagent/graph/nodes.py 提供
      PLANNER_PROMPT/VERIFIER_PROMPT 常量、planner_node（绑定 [todo_write] 结构化输出生成/按
      last_error 修订计划，todos 归一化，无 tool_call 抛 ValueError）、actor_node（绑定
      build_tools+[todo_update] 共 6 工具，ACTOR_PROMPT，ReAct 循环 max_loops=10，事件经
      on_event 回调即时产出且 schema 与 stream_agent_events 一致，todo_update 按 id 回写，返回新增
      AI/ToolMessage 与 last_actor_summary）、verifier_node（绑定
      build_read_only_tools 只读核查，最终 AI 文本解析 JSON 判定（容忍代码围栏），execute_command 运行
      verification_commands 收集 VerificationResult，整体 passed=LLM判定 and
      命令全过，attempts+1，通过清空 last_error 并 todos 全 completed，失败写 last_error 且
      in_progress 标 blocked）、verifier_route（passed 或 attempts>=max_attempts(默认3)
      走 final 否则 planner）。配套：graph/state.py 新增 VerificationCheck 与
      last_actor_summary/last_error/verification_checks；tools/todo_tools.py 新增
      todo_write/todo_update；registry 新增 build_read_only_tools；bash_tool.py
      行为不变提取 execute_command（复核逐行比对确认等价）。tests/test_graph_nodes.py 14 个离线测试 +
      test_graph_state.py 更新字段断言。处理全部验收项 A1-A7。开发期检查：uv run pytest 63
      passed（离线）、uv run novagent --help 退出码 0、uv lock --check 一致。复核发现的未知 todo_id
      追加问题已修正为忽略并补测试。已知限制：nodes.py 复用 core.agent._execute_tool 私有辅助（语义唯一来源，重构
      core 需同步）；verifier 判定依赖 LLM 输出合法 JSON（解析失败按失败处理，有测试覆盖）。
