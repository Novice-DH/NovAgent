acceptance:
  - id: A1
    source: brief.md
    text: 'A1: Scenario: 提示词常量 WHEN 导入 `novagent.prompts.stage4` THEN
      `CONTEXT_COMPRESSION_PROMPT` 为非空 str AND 以 "You are the context_compressor
      node in novagent stage 4." 开头 AND 同时含
      "summary"、"active_goal"、"completed_work"、"open_todos"、"important_files"、"tool_findings"、"sources"、"next_steps"、"risks"
      九个键名与 "Return only JSON with these keys"。'
    result: passed
    reason:
      text: stage4.py CONTEXT_COMPRESSION_PROMPT 与 spec prompts.stage4 文本逐字一致（程序化
        diff），含九键名与 Return only JSON with these keys。
      truncated: false
  - id: A2
    source: brief.md
    text: 'A2: Scenario: 模型调用 WHEN 以含 messages 与任务状态的 state 调用
      `context_compressor_node(state, model=FakeModel)` THEN 模型收到的消息恰为
      `[SystemMessage, HumanMessage]` AND SystemMessage.content 为 stage4 的
      `CONTEXT_COMPRESSION_PROMPT`（同一对象）AND HumanMessage.content
      同时包含任务文本、全部旧消息内容与分层 memory JSON（含 `"working_memory"`）。'
    result: passed
    reason:
      text: nodes.py:669-675 恰以 [SystemMessage(CONTEXT_COMPRESSION_PROMPT),
        HumanMessage] 调用；human_text 含任务、全部旧消息 transcript 与含 working_memory 的分层
        memory JSON。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Scenario: 消息替换 WHEN LLM 返回合法 JSON（九键齐全）THEN 返回的 `messages` 恰含两个元素 AND
      第一个是 `RemoveMessage` 且 `id == REMOVE_ALL_MESSAGES` AND 第二个是 `AIMessage` 且
      `content` 为截断后的 `summary` 字段。"
    result: passed
    reason:
      text: 返回 messages=[RemoveMessage(id=REMOVE_ALL_MESSAGES), AIMessage(截断后
        summary)]，两元素、RemoveMessage 在前，两个分支的 summary 均经 _short_text 截断。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Scenario: 压缩状态字段 WHEN LLM 返回合法 JSON THEN `context_summary ==
      summary`、`context_should_compress is False` AND `context_token_count`
      为正整数且等于对压缩后 summary 的估算 token 数。"
    result: passed
    reason:
      text: context_summary==summary、context_should_compress=False、context_token_count==_estimate_text_tokens(summary)（max(1,len//4)，空为
        0）。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Scenario: 持久化 WHEN 压缩完成 THEN workspace 根下存在 `HISTORY_SUMMARY.md` AND
      文件内容含九个字段各自的小节与截断后文本（summary、active_goal、completed_work、open_todos、import\
      ant_files、tool_findings、sources、next_steps、risks）。"
    result: passed
    reason:
      text: "_persist_history_summary 以 UTF-8 写 runtime.workspace/HISTORY_SUMMARY.md，#
        History Summary 标题加九个 ## 小节覆盖全部九字段；测试断言九字段文本齐全。"
      truncated: false
  - id: A6
    source: brief.md
    text: 'A6: Scenario: 字段截断 WHEN `research_notes` 超过 1600 字符、`agent_handoffs` 超过 6
      条、`summary` 超过 1600 字符 THEN 返回的 `research_notes` 长度 ≤ 1600 且以 "..." 结尾 AND
      `agent_handoffs` 恰保留最近 6 条 AND `context_summary` 长度 ≤ 1600。'
    result: passed
    reason:
      text: research_notes ≤1600 且以 ... 结尾；agent_handoffs 保序保留最近 6 条；context_summary
        ≤1600；其余八键各 ≤800（COMPRESSION_DETAIL_LIMIT）。
      truncated: false
  - id: A7
    source: brief.md
    text: 'A7: Scenario: 压缩事件 WHEN state 已有 `compression_events` 且发生压缩 THEN 返回的
      `compression_events` 为既有事件追加一条新事件 AND 新事件 `node ==
      "context_compressor"`、`token_count` 等于压缩前 transcript 的估算 token
      数、`token_limit` 等于 state 的 `context_token_limit`、`summary` 非空、`created_at`
      非空 AND `history_summary` 等于截断后的 summary。'
    result: passed
    reason:
      text: 恰追加一条事件：node=context_compressor、token_count=formatted transcript
        估算、token_limit=int(state 值 or 0)、reason/summary 非空、created_at 为 UTC
        ISO；history_summary==_short_text(summary,2200)。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Scenario: 解析失败回退 WHEN LLM 返回无法解析为 JSON 的文本 THEN 节点不抛异常 AND 返回的
      `messages[0]` 仍为 `RemoveMessage(id=REMOVE_ALL_MESSAGES)` AND `messages[1]`
      为非空 `AIMessage`（内容来自既有消息的确定性回退）AND `HISTORY_SUMMARY.md` 仍被写入。"
    result: passed
    reason:
      text: _parse_verifier_json 对不可解析文本返回 None 不抛异常；回退摘要取既有消息截断拼接、八键置空、RemoveMessage
        仍在前、文件仍写入；测试覆盖。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: Scenario: 容错 WHEN state 缺少 `runtime` 或 `messages` THEN 节点不抛异常 AND
      仍返回完整更新
      dict（`messages`/`context_summary`/`context_token_count`/`context_should_c\
      ompress`/`compression_events` 等键齐全），仅跳过文件持久化。"
    result: passed
    reason:
      text: messages/runtime 均容错读取（or []/getattr None），transcript 空占位，跳过持久化，仍返回完整 10
        键更新 dict；空 state 测试通过。
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Scenario: 现有行为不破坏 WHEN 在 change 工作区运行 `uv sync` THEN 成功且无新依赖、lock 一致
      AND `uv run pytest` 全部通过（离线），既有
      `tests/test_graph_nodes.py`、`tests/test_memory.py`、`tests/test_context_mo\
      nitor.py` 等覆盖不回归。"
    result: passed
    reason:
      text: git status 仅 nodes.py 修改、stage4.py
        与测试为新增，workflow/state/memory/pyproject/uv.lock 未动；Verifier 第一手运行 uv run
        pytest -q：124 passed 离线（含 9 项新测试），monitor 的 _estimate_tokens(messages,
        model) 未被遮蔽。
      truncated: false
