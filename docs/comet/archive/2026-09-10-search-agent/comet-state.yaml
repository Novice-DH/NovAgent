acceptance:
  - id: A1
    source: brief.md
    text: 'A1: Scenario: 缺少 API key 的降级 WHEN 未设置 `TAVILY_API_KEY` 时 invoke
      `WebSearchTool`（query 任意）THEN 返回 dict `ok is False` 且 `error == "missing
      TAVILY_API_KEY"` 且携带传入 query AND 全程不发起网络请求、不抛异常。'
    result: passed
    reason:
      text: web_search_tool.py 缺 key 分支返回 error 恰为 "missing TAVILY_API_KEY"
        且不构造客户端不发网络请求，测试精确断言 error 字符串与 query 透传
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Scenario: 正常搜索返回 WHEN 设置 `TAVILY_API_KEY` 且注入 fake `TavilyClient`（返回
      answer 与多条 results）后 invoke `WebSearchTool` THEN 返回 `ok is True` 的 dict 且
      `query` 透传、`answer` 为 API answer、`results` 每项恰含 `title/url/content/score`
      四键（API 缺键补空值）AND fake 的 search 收到 `max_results` 透传。"
    result: passed
    reason:
      text: 结果归一化为恰含 title/url/content/score 四键（缺键补 ""/0.0），测试断言整 dict 相等且 fake 收到
        max_results=2 与 include_answer=True 透传
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Scenario: 搜索异常降级 WHEN fake `TavilyClient.search` 抛异常 THEN
      `WebSearchTool` 返回 `ok is False` 且 `error` 非空且携带 query AND 不抛异常。"
    result: passed
    reason:
      text: "客户端构造与 search 异常均被捕获转为 {ok: False, query, error}，BoomClient 测试断言不抛异常且
        error 含原始异常信息"
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4: Scenario: ReAct 循环与返回结构 WHEN 以 `state={"task": ..., "research_notes":
      ...}`、instruction 与收集型 writer 注入 FakeModel（第一轮返回 `web_search`
      tool_call，第二轮纯文本）调用 `run_search_agent` THEN 返回 `ok is True` 且 `summary`
      为最后 AI 文本 AND `queries` 含所发查询 AND `sources` 为结果 url（去重保序）AND `messages`
      依次为 AIMessage（带 tool_call）、ToolMessage（内容为合法 JSON）、AIMessage（纯文本）AND
      `tool_events` 依次含 `tool_call` 与 `search_results` 事件且 writer 收到同一批事件。'
    result: passed
    reason:
      text: 返回 dict 恰为 {ok, summary, queries, sources, messages, tool_events}
        六键，测试断言消息序列 AIMessage/ToolMessage(合法JSON)/AIMessage、事件依次为 tool_call 与
        search_results 且 writer 收到同一批事件
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Scenario: 消息构造 WHEN 调用 `run_search_agent` THEN 发给模型的首条消息为
      SystemMessage 且内容即 `SEARCH_AGENT_PROMPT` AND 第二条 HumanMessage 同时包含
      task、instruction 与已有研究笔记文本。"
    result: passed
    reason:
      text: 首条消息为 SystemMessage(SEARCH_AGENT_PROMPT)，HumanMessage 同时包含
        task、instruction 与 research_notes（缺失时标注 no research notes yet），均有测试断言
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Scenario: 循环边界 WHEN FakeModel 每轮都返回 tool_call 且 `max_loops=2` THEN
      模型恰被调用 2 次后返回 AND WHEN FakeModel 第一轮即返回纯文本 THEN 模型只被调用 1 次（提前结束）。"
    result: passed
    reason:
      text: range(max_loops) 加无 tool_calls 即 break，测试覆盖每轮 tool_call 时 max_loops=2 恰调用
        2 次与首轮纯文本仅调用 1 次两个方向
      truncated: false
  - id: A7
    source: brief.md
    text: 'A7: Scenario: 提示词常量 WHEN 导入 `novagent.agents.search_agent` THEN
      `SEARCH_AGENT_PROMPT` 以 "You are searchAgent, a focused research
      specialist." 开头 AND 含 "WebSearchTool" AND 含 "Do not write files or produce
      application code."。'
    result: passed
    reason:
      text: SEARCH_AGENT_PROMPT 与 brief 原文逐行比对逐字一致：开头句、WebSearchTool、Do not write
        files or produce application code. 均在
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Scenario: 现有行为不破坏 WHEN 在仓库根目录运行 `uv sync` THEN 成功且 lock 与 pyproject
      一致（新增 tavily-python）AND `uv run pytest` 全部通过（离线）AND `uv run novagent
      --help` 退出码 0。"
    result: passed
    reason:
      text: pyproject 新增 tavily-python>=0.5.0 且 uv.lock 含 tavily-python 0.8.1
        一致；WebSearchTool 未进 registry、tavily 导入不扩散、agents/__init__.py 为空包；Runtime
        命令检查（pytest 81 passed、--help exit 0）全部通过
      truncated: false
