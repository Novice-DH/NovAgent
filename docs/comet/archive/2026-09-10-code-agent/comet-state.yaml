acceptance:
  - id: A1
    source: brief.md
    text: 'A1: Scenario: 工具绑定 WHEN 以含 `runtime`（指向临时 workspace）的 state 注入 FakeModel
      调用 `run_code_agent` THEN FakeModel 绑定的工具名序列恰为 `["read_file", "write_file",
      "edit_file", "grep", "bash", "todo_update"]`。'
    result: passed
    reason:
      text: code_agent.py:104 绑定 build_tools(5 个，registry 顺序
        read_file/write_file/edit_file/grep/bash) + todo_update，测试断言绑定名序列恰为 6
        个且顺序一致
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Scenario: 消息构造 WHEN 调用 `run_code_agent`（state 含 task 与
      session_context）THEN 发给模型的首条消息为 SystemMessage 且内容即 `CODE_AGENT_PROMPT` AND
      第二条 HumanMessage 同时包含 task、instruction、session_context 文本与 memory 快照段 AND
      快照与 session 缺失时包含占位标注。"
    result: passed
    reason:
      text: 首条 SystemMessage 内容即 CODE_AGENT_PROMPT，HumanMessage 含
        task/instruction/session_context/memory 段，(no session context) 与 (no
        memory snapshot) 占位均有测试覆盖
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Scenario: ReAct 循环与返回结构 WHEN 注入 FakeModel（write_file 写文件 →
      `todo_update` 置 in_progress → `todo_update` 置 completed → 纯文本结束）与收集型
      writer THEN 返回 `ok is True` AND `summary` 为最后 AI 文本 AND `todos` 中对应 todo
      状态经 pending→in_progress→completed AND workspace 出现写入文件 AND `messages`
      类型序列以 AIMessage 开始、含 ToolMessage（内容为合法 JSON）、以 AIMessage 结束 AND
      `tool_events` 类型序列为
      `ai_message`、`tool_call`、`tool_result`（每工具一对）、`ai_message`、`final_answer`
      AND writer 收到同一批事件。"
    result: passed
    reason:
      text: write_file→in_progress→completed→纯文本场景下 ok/summary/todos 终态/文件落盘/messages
        类型序列（含合法 JSON ToolMessage）/事件序列（每轮先 ai_message、每工具一对
        tool_call+tool_result、末尾 final_answer）/writer 同批事件全部断言通过；todo 实时合并逻辑与
        actor_node 逐字一致，中间态由调用顺序与代码路径等价保证
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Scenario: todo 状态迁移边界 WHEN FakeModel 调用 `todo_update` 将某 todo 置
      `blocked`（含 note）THEN 返回 `todos` 对应项 status 为 `blocked` 且 note 已更新 AND
      WHEN 调用未知 `todo_id` THEN `todos` 保持不变且不报错。"
    result: passed
    reason:
      text: blocked+note 更新生效、未知 todo_id 时 todos 不变且不报错，_VALID_STATUS 白名单与 note 逻辑与
        graph/nodes.py 的 actor_node 完全一致
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Scenario: 循环边界 WHEN FakeModel 第一轮即纯文本 THEN 模型只被调用 1 次（提前结束）AND WHEN
      FakeModel 每轮都返回 tool_call 且 `max_loops=2` THEN 模型恰被调用 2 次后返回。"
    result: passed
    reason:
      text: 第一轮纯文本仅 1 次模型调用提前结束；max_loops=2 配 5 个 tool_call 响应恰调用 2 次后返回，两个方向均有测试
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Scenario: runtime 缺失 WHEN 以不含 `runtime` 的 state 调用 `run_code_agent`
      THEN 抛出 `ValueError`。"
    result: passed
    reason:
      text: state 无 runtime 时抛 ValueError（message 含 runtime），测试 pytest.raises 匹配，与
        actor_node 一致
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Scenario: 未知工具降级 WHEN FakeModel 调用未绑定的 `notepad_append` THEN 该调用结果文本以
      `Error: unknown tool` 开头并作为 ToolMessage 回传 AND 循环继续不中断。"
    result: passed
    reason:
      text: "notepad_append 未绑定，结果文本以 Error: unknown tool 开头（格式化与
        graph.nodes._execute_tool 逐字相同）经 ToolMessage 回传，模型被调用 2 次证明循环继续"
      truncated: false
  - id: A8
    source: brief.md
    text: 'A8: Scenario: 提示词常量 WHEN 导入 `novagent.agents.code_agent` THEN
      `CODE_AGENT_PROMPT` 以 "You are codeAgent, a focused implementation
      specialist." 开头 AND 含 "TodoUpdateTool"、"NotepadAppendTool"、"BashTool" AND
      以 "End with a concise summary of files changed and checks run." 结尾。'
    result: passed
    reason:
      text: CODE_AGENT_PROMPT 与 spec.md agents.code_agent 节用户原文 20
        行逐行逐字一致（含换行位置、两空格续行、引号与撇号，两侧无行尾空白），仅末尾多一个换行符属豁免范围，开头/结尾句与三个工具名提及均符合
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: Scenario: memory 接口预留 WHEN 调用 `build_memory_snapshot(state)` THEN
      返回空字符串 AND 全程不发起模型调用或网络请求。"
    result: passed
    reason:
      text: build_memory_snapshot 恒返回空字符串，函数体无模型调用/网络/副作用，测试对两种 state 断言为空
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Scenario: 现有行为不破坏 WHEN 在仓库根目录运行 `uv sync` THEN 成功且无新依赖、lock 一致 AND
      `uv run pytest` 全部通过（离线）AND `uv run novagent --help` 退出码 0。"
    result: passed
    reason:
      text: Runtime 登记的 uv sync/uv lock --check/pytest(79 passed)/novagent --help
        全部通过，且 git diff 028fcd6..HEAD --stat 显示本 change 仅新增 3
        个源码/测试文件，pyproject.toml 与 uv.lock 未被修改
      truncated: false
