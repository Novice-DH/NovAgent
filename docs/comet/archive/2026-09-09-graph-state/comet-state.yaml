acceptance:
  - id: A1
    source: brief.md
    text: "A1: Scenario: 共享状态类型定义 WHEN 导入 `novagent.graph.state` THEN 模块提供
      `TodoItem`、`VerificationResult`、`NovGraphState` 三个 TypedDict AND
      `TodoItem` 注解恰为 id: str、content: str、status: str、note: str AND
      `VerificationResult` 注解恰为 command: str、ok: bool、exit_code: int |
      None、stdout: str、stderr: str AND `NovGraphState` 注解恰为 task: str、runtime:
      RuntimeState、messages、plan_summary: str、todos:
      list[TodoItem]、acceptance_criteria: list[str]、verification_commands:
      list[str]、verification_results: list[VerificationResult]、passed:
      bool、attempts: int、max_attempts: int、final_answer: str AND `NovGraphState`
      的 `__total__` 为 False（所有字段可选）。"
    result: passed
    reason:
      text: 探针确认三个 TypedDict 存在；TodoItem 注解恰为 id/content/status/note 均为
        str，VerificationResult 注解恰为五字段且 exit_code 为 int | None（get_args=(int,
        NoneType)）；NovGraphState 十二字段顺序与 spec 一致，__total__ 为
        False（state.py:26-38）。
      truncated: false
  - id: A2
    source: brief.md
    text: 'A2: Scenario: messages 使用 add_messages reducer WHEN 检查
      `NovGraphState.__annotations__["messages"]` THEN 其为
      `Annotated[list[BaseMessage], add_messages]` 形式（`typing.get_args` 可取出
      list[BaseMessage] 与 add_messages）AND `add_messages` 可从 langgraph 导入 AND
      `BaseMessage` 来自 langchain_core.messages。'
    result: passed
    reason:
      text: 探针输出 messages 注解 get_args 为 (list[BaseMessage], add_messages)，inner origin
        为 list、args 为 (BaseMessage,)；reducer 对象模块为
        langgraph.graph.message，BaseMessage 来自 langchain_core.messages；runtime
        注解 is 比较确认复用 novagent.core.state.RuntimeState 同一对象。
      truncated: false
  - id: A3
    source: brief.md
    text: 'A3: Scenario: LangGraph 自动合并消息 WHEN 用仅含 messages 通道的最小 StateGraph 以初始
      `[SystemMessage("s")]` invoke 后再以 `[HumanMessage("hi")]` 更新 THEN
      通道内消息为两条的拼接（`[SystemMessage("s"), HumanMessage("hi")]`）而不是覆盖 AND 直接调用
      `add_messages(["a"], ["b"])` 追加为 `["a", "b"]`。'
    result: passed
    reason:
      text: "独立运行最小 StateGraph：以 [SystemMessage('s')] invoke 后节点返回 {'messages':
        [HumanMessage('hi')]}，结果为 [SystemMessage(s), HumanMessage(hi)]
        拼接而非覆盖；直接调用 add_messages 同样追加为 ['s','hi']；tests/test_graph_state.py 7
        个测试复跑全部通过。"
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Scenario: 依赖与现有行为不破坏 WHEN 在仓库根目录运行 `uv sync` THEN 安装成功且 `uv.lock` 与
      `pyproject.toml` 一致 AND `pyproject.toml` 运行依赖新增 `langgraph` 且未引入完整
      `langchain` 发行包 AND `uv run pytest` 全部通过（离线）AND `uv run novagent --help`
      退出码 0。"
    result: passed
    reason:
      text: Runtime 四项检查（uv sync、uv lock --check、uv run pytest -q、uv run novagent
        --help）均 exit 0；pyproject.toml 运行依赖含 langgraph>=0.2.0；grep -cE '^name =
        "langchain"$' uv.lock 结果为 0，锁内仅有 langchain-core/-openai/-protocol 与
        langgraph，未引入完整 langchain 发行包。
      truncated: false
