acceptance:
  - id: A1
    source: brief.md
    text: 'A1: Scenario: RULES_LAYER 常量 WHEN 导入 `novagent.graph.memory` THEN
      `RULES_LAYER` 为 dict 且 `scope == "workspace"`、`storage == "internal"` AND
      `rules` 为 5
      条非空字符串列表，逐条覆盖工作区限定、相对路径约定、上下文外置、三类文件语义（TODO.md/NOTEPAD.md/HISTORY_SUMMARY.md）与"不暴露
      memory 写工具"。'
    result: passed
    reason:
      text: memory.py:44-56 定义
        RULES_LAYER，scope=='workspace'、storage=='internal'、rules 为 5 条非空字符串。用
        python -c 从 spec.md 代码块 ast.literal_eval 提取英文原文逐字符比对，5 条全部一致（含 'Work
        inside the current workspace only.' 至 'layered memory is assembled by
        the runtime.'），未改写。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Scenario: 三层结构 WHEN 以含 task/todos/plan_summary 等键的 state 调用
      `build_layered_memory(state)` THEN 返回 dict 恰含
      `rules`、`working_memory`、`history_summary_store` 三键 AND `working_memory` 含
      node/task/session_id/session_turn/plan_summary/todos/acceptance_criteria/\
      verification_commands/research_notes/sources/agent_handoffs/code_agent_su\
      mmary/verifier_summary/last_error/attempts/max_attempts 全部键 AND
      `history_summary_store` 含
      history_path/history_exists/history_summary/notepad_path/notepad_exists/n\
      otepad/context_summary/compression_events 全部键。"
    result: passed
    reason:
      text: python -c 断言 build_layered_memory({runtime:None}) 返回键集恰为 {rules,
        working_memory, history_summary_store}；working_memory 恰 16
        键（node/task/session_id/session_turn/plan_summary/todos/acceptance_criteria/verification_commands/research_notes/sources/agent_handoffs/code_agent_summary/verifier_summary/last_error/attempts/max_attempts）；history_summary_store
        恰 8
        键（history_path/history_exists/history_summary/notepad_path/notepad_exists/notepad/context_summary/compression_events）。tests/test_memory.py:61-96
        同样断言。
      truncated: false
  - id: A3
    source: brief.md
    text: 'A3: Scenario: 文件读取 WHEN workspace 存在 NOTEPAD.md 与 HISTORY_SUMMARY.md THEN
      `read_notepad`/`read_history_summary` 返回 `exists=True` 与文件全文 AND WHEN
      workspace 不存在这两个文件 THEN 返回 `exists=False`、`content=""` 且不抛异常。'
    result: passed
    reason:
      text: "memory.py:59-78 经 Path.read_text(utf-8) 读取，缺失返回 {'exists': False,
        'content': ''} 不抛异常，非 UTF-8/IO 错误经 except (OSError, UnicodeDecodeError)
        兜底。uv run pytest -k 'read or notepad...' 9 passed：存在返回
        exists=True+全文、缺失目录/None runtime/非 UTF-8 均容错。"
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4: Scenario: 截断辅助 WHEN 以超长文本调用 `_short_text(text, limit)` THEN 返回长度不超过
      limit 且以 "..." 结尾 AND 短文本原样返回。'
    result: passed
    reason:
      text: memory.py:81-88 _short_text：len<=limit 原样返回；超长返回
        value[:limit-3]+'...'（总长恰为 limit，验证 'x'*50/10 -> 'xxxxxxx...'）；limit<=3
        有防御分支。python -c 断言与 tests/test_memory.py:172-182 一致通过。
      truncated: false
  - id: A5
    source: brief.md
    text: 'A5: Scenario: handoffs 修剪 WHEN `agent_handoffs` 超过 6 条 THEN
      `working_memory["agent_handoffs"]` 恰保留最近 6 条且顺序保持。'
    result: passed
    reason:
      text: memory.py:91-95 _trim_handoffs 用 list 切片 [-6:]，保留末尾 6 条且顺序保持（9 条输入得
        [3,4,5,6,7,8]，测试 8 条得 [2..7]），非 list 返回 []。
      truncated: false
  - id: A6
    source: brief.md
    text: 'A6: Scenario: sources 收敛 WHEN `sources` 含 title/url/content/score THEN
      `working_memory["sources"]` 每项仅含 `title` 与 `url` 键。'
    result: passed
    reason:
      text: memory.py:98-111 _norm_sources 每项仅保留 title/url（缺失补 ''），含 content/score
        的输入验证输出恰为 [{'title','url'}]，非 list 返回 []。tests/test_memory.py:112-135
        断言通过。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Scenario: 压缩历史层 WHEN state 含 `context_summary` 与
      `compression_events`（>3 条） THEN `history_summary_store` 反映该
      context_summary（≤1600 截断）AND `compression_events` 仅保留最近 3 条。"
    result: passed
    reason:
      text: memory.py:154-159 context_summary 经 _short_text(...,1600)（9999 字输入验证输出长恰
        1600 且以 '...' 结尾）；compression_events 取列表副本 [-3:]，5 条输入验证保留 [n2,n3,n4]
        且顺序保持。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Scenario: prompt 格式化 WHEN 调用
      `format_layered_memory_for_prompt(memory)` THEN 返回合法 JSON 字符串且
      `json.loads` 后与输入相等。"
    result: passed
    reason:
      text: memory.py:169-171 format_layered_memory_for_prompt 为 json.dumps(memory,
        ensure_ascii=False)；python -c 与 tests/test_memory.py 验证返回 str、json.loads
        后与输入完全相等（含中文内容不被转义）。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: Scenario: 状态 schema WHEN 检查 `NovGraphState.__annotations__` THEN 包含
      context_summary/context_token_count/context_token_limit/context_should_co\
      mpress/context_next_node/compression_events/memory_snapshot/history_summa\
      ry 八个新字段。"
    result: passed
    reason:
      text: state.py:67-74 新增 8 字段，python -c 验证 NovGraphState.__annotations__
        全部包含且类型正确（str/int/bool/list[CompressionEvent]/LayeredMemory）。无循环导入：memory.py
        仅导入 novagent.core.state，全仓 grep 确认 graph.memory 唯一外部导入方为 state.py:9。
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Scenario: 现有行为不破坏 WHEN 在仓库根目录运行 `uv sync` THEN 成功且无新依赖、lock 一致 AND
      `uv run pytest` 全部通过（离线）。"
    result: passed
    reason:
      text: 独立复跑 uv run pytest -q -> 107 passed in 6.59s（离线）。git status/diff 确认
        pyproject.toml 与 uv.lock 未修改（uv sync 后 lock
        一致、无新依赖）；nodes.py/workflow.py/agents/code_agent.py
        均未改动，code_agent.build_memory_snapshot 保持原空桩返回（符合 spec 与 D7 不接线要求）。
      truncated: false
